{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-4 text-primary fw-bold">تسجيل الدخول</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">اسم المستخدم:</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور:</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">دخول</button>
        </form>
        <p class="text-center mt-3 text-muted">
            ليس لديك حساب؟ <a href="{% url 'accounts:register' %}" class="text-primary">أنشئ حساباً جديداً</a>
        </p>
    </div>
</div>
{% endblock %}
